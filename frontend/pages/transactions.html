<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>FinanceOps Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    >

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="./css/styles.css">
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <h1>FinanceOps</h1>
          <p>Financial Operations</p>
        </div>

        <nav class="sidebar-navigation" aria-label="Main navigation">
          <ul>
            <li>
              <a href="./index.html" aria-current="page">Dashboard</a>
            </li>

            <li>
              <a href="./pages/transactions.html">Transactions</a>
            </li>

            <li>
              <a href="./pages/revenue.html">Revenue</a>
            </li>

            <li>
              <a href="./pages/expenses.html">Expenses</a>
            </li>

            <li>
              <a href="#">Budgets</a>
            </li>

            <li>
              <a href="#">Invoices</a>
            </li>

            <li>
              <a href="#">Reconciliation</a>
            </li>

            <li>
              <a href="#">Reports</a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="dashboard">
        <header class="dashboard-header">
          <div>
            <p class="eyebrow">Financial overview</p>
            <h2>Transactions</h2>
      </main>
    </div>

    <div class="modal" id="transaction-modal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <h2>Add transaction</h2>

      <button
        id="close-modal-btn"
        type="button"
        aria-label="Close transaction form"
      >
        ×
      </button>
    </div>

    <form id="transaction-form">
      
      <label for="transaction-date">Date</label>
      <input
        id="transaction-date"
        name="date"
        type="date"
        required
      >

      <label for="transaction-description">Description</label>
      <input
        id="transaction-description"
        name="description"
        type="text"
        required
      >
     <label for="transaction-category">Category</label>
     <input
       id="transaction-category"
       name="category"
       type="text"
       required
      >

      <label for="transaction-type">Type</label>
      <select id="transaction-type" name="type" required>
        <option value="">Choose type</option>
        <option value="Revenue">Revenue</option>
        <option value="Expense">Expense</option>
      </select>


      <label for="transaction-amount">Amount</label>
      <input
        id="transaction-amount"
        name="amount"
        type="number"
        min="0.01"
        step="0.01"
        required
      >

      <button
        id="save-transaction-btn"
       type="submit"
       disabled
      >
        Save transaction
      </button>

    </form>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/dashboard.js"></script>
    <script src="../js/transactions.js"></script>
  </body>
</html>
